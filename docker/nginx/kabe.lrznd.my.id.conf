# Kabe — Knowledge Base
# Domain: kabe.lrznd.my.id
# Path: /etc/nginx/sites-available/kabe.lrznd.my.id
#
# Setup:
#   1. Copy/symlink ke sites-enabled/
#      ln -s /etc/nginx/sites-available/kabe.lrznd.my.id /etc/nginx/sites-enabled/
#   2. Test: nginx -t
#   3. Reload: systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name kabe.lrznd.my.id;

    # Upload limit (Directus file uploads)
    client_max_body_size 50M;

    # ============================================
    # Directus CMS — /cms/*
    # ============================================
    location /cms/ {
        # Strip /cms/ prefix before proxying to Directus
        proxy_pass http://127.0.0.1:8055/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Timeout buat upload file besar
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Directus assets (static files, no prefix strip needed)
    location /cms/assets/ {
        proxy_pass http://127.0.0.1:8055/assets/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache assets
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ============================================
    # Next.js Web — everything else
    # ============================================
    location / {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Next.js ISR/SSR timeout
        proxy_read_timeout 120s;
    }

    # Next.js static assets (_next/static/*)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000/_next/static/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;

        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # ============================================
    # Security headers
    # ============================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
